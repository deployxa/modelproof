[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelproof"
version = "0.2.0"
description = "Local-first, evidence-first evaluation lab for local coding models. Reproducible runs, sandboxed execution, verifiable evidence bundles."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Reagan Moseti", email = "reaganmoseti@gmail.com" }]
keywords = ["llm", "evaluation", "benchmark", "local-inference", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
modelproof = "modelproof.cli:main"

[project.urls]
Homepage = "https://github.com/MosetiReagan/modelproof"
Repository = "https://github.com/MosetiReagan/modelproof"
Issues = "https://github.com/MosetiReagan/modelproof/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelproof = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/modelproof --cov-report=term-missing"
timeout = 120

[tool.coverage.run]
source = ["src/modelproof"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["modelproof"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
